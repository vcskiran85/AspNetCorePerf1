name: Build and deploy .NET Core application to Web App AspNetCorePerfMain
on:
  push:
    branches:
    - master
permissions:
  id-token: write
  contents: read
env:
  AZURE_WEBAPP_NAME: AspNetCorePerfMain
  AZURE_WEBAPP_PACKAGE_PATH: Main\published
  CONFIGURATION: Release
  DOTNET_CORE_VERSION: 10.0.x
  WORKING_DIRECTORY: Main
jobs:
  build:
    environment: AspNetCorePerfMain_Env
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_CORE_VERSION }}
    - name: Restore
      run: dotnet restore "${{ env.WORKING_DIRECTORY }}"
    - name: Build
      run: dotnet build "${{ env.WORKING_DIRECTORY }}" --configuration ${{ env.CONFIGURATION }} --no-restore
    - name: Test
      run: dotnet test "${{ env.WORKING_DIRECTORY }}" --no-build
    - name: Publish
      run: dotnet publish "${{ env.WORKING_DIRECTORY }}" --configuration ${{ env.CONFIGURATION }} --no-build --output "${{ env.AZURE_WEBAPP_PACKAGE_PATH }}"
    - name: Publish Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: webapp
        path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
  deploy:
    environment: AspNetCorePerfMain_Env
    runs-on: windows-latest
    needs: build
    steps:
    - name: Validate Azure login configuration
      shell: pwsh
      env:
        AZURE_CLIENT_ID: ${{ vars.AspNetCorePerfMain_CLIENT_ID_D48D || secrets.AspNetCorePerfMain_CLIENT_ID_D48D }}
        AZURE_TENANT_ID: ${{ vars.AspNetCorePerfMain_TENANT_ID_D48D }}
        AZURE_SUBSCRIPTION_ID: ${{ vars.AspNetCorePerfMain_SUBSCRIPTION_ID_D48D }}
      run: |
        foreach ($name in @('AZURE_CLIENT_ID', 'AZURE_TENANT_ID', 'AZURE_SUBSCRIPTION_ID')) {
          if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
            throw "$name is missing. Configure the Azure OIDC settings described in README.md."
          }
        }
    - name: Download artifact from build job
      uses: actions/download-artifact@v4
      with:
        name: webapp
        path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
    - name: Azure Login
      uses: azure/login@v2
      with:
        client-id: ${{ vars.AspNetCorePerfMain_CLIENT_ID_D48D || secrets.AspNetCorePerfMain_CLIENT_ID_D48D }}
        tenant-id: ${{ vars.AspNetCorePerfMain_TENANT_ID_D48D }}
        subscription-id: ${{ vars.AspNetCorePerfMain_SUBSCRIPTION_ID_D48D }}
    - name: Deploy to Azure WebApp
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
