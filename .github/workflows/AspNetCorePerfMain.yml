name: Build and deploy .NET Core application to Web App AspNetCorePerfMain
on:
  push:
    branches:
    - master
permissions:
  id-token: write
  contents: read
env:
  AZURE_WEBAPP_NAME: AspNetCorePerfMain
  AZURE_WEBAPP_PACKAGE_PATH: Main\published
  CONFIGURATION: Release
  DOTNET_CORE_VERSION: 10.0.x
  WORKING_DIRECTORY: Main
jobs:
  build:
    environment: AspNetCorePerfMain_Env
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_CORE_VERSION }}
    - name: Restore
      run: dotnet restore "${{ env.WORKING_DIRECTORY }}"
    - name: Build
      run: dotnet build "${{ env.WORKING_DIRECTORY }}" --configuration ${{ env.CONFIGURATION }} --no-restore
    - name: Test
      run: dotnet test "${{ env.WORKING_DIRECTORY }}" --no-build
    - name: Publish
      run: dotnet publish "${{ env.WORKING_DIRECTORY }}" --configuration ${{ env.CONFIGURATION }} --no-build --output "${{ env.AZURE_WEBAPP_PACKAGE_PATH }}"
    - name: Publish Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: webapp
        path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
  deploy:
    environment: AspNetCorePerfMain_Env
    runs-on: windows-latest
    needs: build
    steps:
    - name: Download artifact from build job
      uses: actions/download-artifact@v4
      with:
        name: webapp
        path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
    - name: Validate Azure login configuration
      shell: pwsh
      env:
        AspNetCorePerfMain_CLIENT_ID_D48D: ${{ secrets.AspNetCorePerfMain_CLIENT_ID_D48D }}
        AspNetCorePerfMain_TENANT_ID_D48D: ${{ secrets.AspNetCorePerfMain_TENANT_ID_D48D }}
        AspNetCorePerfMain_SUBSCRIPTION_ID_D48D: ${{ secrets.AspNetCorePerfMain_SUBSCRIPTION_ID_D48D }}
      run: |
        $names = 'AspNetCorePerfMain_CLIENT_ID_D48D', 'AspNetCorePerfMain_TENANT_ID_D48D', 'AspNetCorePerfMain_SUBSCRIPTION_ID_D48D'
        $missing = @($names | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) })
        if ($missing.Count -gt 0) {
          throw "Configure these GitHub Actions secrets for AspNetCorePerfMain_Env: $($missing -join ', ')"
        }
    - name: Azure Login
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AspNetCorePerfMain_CLIENT_ID_D48D }}
        tenant-id: ${{ secrets.AspNetCorePerfMain_TENANT_ID_D48D }}
        subscription-id: ${{ secrets.AspNetCorePerfMain_SUBSCRIPTION_ID_D48D }}
    - name: Deploy to Azure WebApp
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
